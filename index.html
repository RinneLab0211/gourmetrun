<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>北海道グルメラン</title>
    <!-- 3Dライブラリを読み込むための必須設定 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main id="app">
        <canvas id="game"></canvas>
        <section id="hud">
            <div class="topbar">
                <div>
                    <p class="eyebrow">北海道グルメラン</p>
                    <h1 id="stageName">室蘭</h1>
                    <p id="stageGoal">目標 0 / 5000</p>
                </div>
                <div class="status">
                    <div class="hearts" id="hearts">♥♥♥</div>
                    <div class="score"><span id="score">0</span><small>total</small></div>
                    <div class="best">BEST <span id="bestScore">0</span></div>
                </div>
            </div>
            <div class="route"><div id="progressFill"></div></div>
        </section>
        <section id="startPanel" class="panel">
            <h2>北海道グルメラン</h2>
            <button id="startButton">START</button>
        </section>
        <nav id="touchControls">
            <button id="leftButton">‹</button>
            <button id="attackButton">🍡</button>
            <button id="jumpButton">↑</button>
            <button id="rightButton">›</button>
        </nav>
    </main>
    <script type="module" src="./src/game.js"></script>
</body>
</html>
